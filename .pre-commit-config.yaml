repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: npx biome check --write --no-errors-on-unmatched
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: true
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(astro|md|mdx|yaml|yml)$
        pass_filenames: true
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
        pass_filenames: true
